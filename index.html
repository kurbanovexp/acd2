<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Детекция дефектов (YOLOv8 ONNX)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }

    h1 {
      margin-bottom: 20px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
      max-width: 400px;
      margin-bottom: 15px;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      background-color: #007bff;
      color: #ffffff;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s;
    }

    button:disabled {
      background-color: #444444;
      color: #888888;
      cursor: not-allowed;
    }

    .progress-container {
      width: 100%;
      display: none;
      text-align: center;
    }

    progress {
      width: 100%;
      height: 20px;
    }

    #status {
      font-size: 14px;
      color: #00ff66;
      margin-bottom: 15px;
      text-align: center;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 800px;
    }

    #outputCanvas {
      max-width: 100%;
      border: 1px solid #333333;
      border-radius: 8px;
    }

    /* Блок для вывода списка обнаруженных дефектов */
    .detections-panel {
      width: 100%;
      background-color: #1e1e1e;
      border: 1px solid #333333;
      border-radius: 8px;
      padding: 15px;
      box-sizing: border-box;
    }

    .detections-panel h3 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 18px;
      color: #ffffff;
      border-bottom: 1px solid #333333;
      padding-bottom: 8px;
    }

    #detectionsList {
      list-style-type: none;
      padding: 0;
      margin: 0;
      max-height: 200px;
      overflow-y: auto;
    }

    #detectionsList li {
      padding: 6px 10px;
      margin-bottom: 4px;
      border-radius: 4px;
      background-color: #2a2a2a;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
    }
  </style>

  <!-- ONNX Runtime Web -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body>

  <h1>Детекция дефектов (YOLOv8 ONNX)</h1>

  <div class="controls">
    <button id="loadModelBtn">1. Загрузить модель</button>
    
    <div id="progressContainer" class="progress-container">
      <progress id="progressBar" value="0" max="100"></progress>
      <div id="progressText">0%</div>
    </div>

    <button id="startCameraBtn" disabled>2. Открыть камеру</button>
  </div>

  <div id="status">Нажмите "Загрузить модель" для начала работы.</div>

  <div class="main-container">
    <!-- Скрытое видео для считывания кадров -->
    <video id="webcamVideo" autoplay playsinline style="display: none;"></video>
    
    <!-- Canvas с отрисовкой -->
    <canvas id="outputCanvas"></canvas>

    <!-- Текстовый блок вывода детекций -->
    <div class="detections-panel">
      <h3>Обнаруженные дефекты:</h3>
      <ul id="detectionsList">
        <li style="color: #888;">Список пуст</li>
      </ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
